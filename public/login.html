<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리듬 게임 - 로그인</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <h1> 리듬 게임</h1>

        <div class="social-area">
            <button id="kakao-btn" class="social-btn kakao">카카오로 시작하기</button>

        </div>
        <p class="error-msg" id="login-error"></p>

        <div class="guest-area">
            <button id="guest-btn"> 게스트로 시작</button>
        </div>
    </div>

    <script src="js/login.js"></script>

</html>
